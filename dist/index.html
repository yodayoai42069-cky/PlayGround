const panelEl=document.getElementById("panel");
const sceneEl=document.getElementById("scene");
const toastEl=document.getElementById("toast");
let toastT=null;
function toast(msg){
  toastEl.innerHTML=msg; toastEl.style.display="block";
  clearTimeout(toastT); toastT=setTimeout(()=>{toastEl.style.display="none";},3400);
}
function showModal(html){ document.getElementById("modalBody").innerHTML=html; document.getElementById("modal").style.display="flex"; }
document.getElementById("modal").addEventListener("click",()=>{document.getElementById("modal").style.display="none";});

let menus=[]; // stack of {title, sub, items:fn, view:fn|null, sel}
const cur=()=>menus[menus.length-1];
function initWomanState(){
  WOMEN.forEach(w=>{
    const old=state.women[w.id]||{};
    state.women[w.id]=Object.assign({}, w, old, {
      id:w.id, aff:(typeof old.aff==="number"?old.aff:0),
      married:!!old.married, couple:!!old.couple, pregnant:!!old.pregnant
    });
  });
}
function pushMenu(title,a,b,opts){
  // Supports pushMenu(title, items, opts) and pushMenu(title, sub, items, opts)
  let sub, items;
  if(Array.isArray(a)){ items=a; opts=b||{}; sub=opts.sub||""; }
  else { sub=a; items=b; opts=opts||{}; }
  opts=opts||{};
  // Normalize: items may be an array (static) or a builder function (fresh every render)
  if(typeof items!=="function") items=(function(arr){ return function(){ return arr; }; })(items);
  menus.push({title:title,sub:sub,items:items,view:opts.view||null,sel:opts.sel||0});
  renderAll();
}
function popMenu(){ if(menus.length>1){ menus.pop(); renderAll(); } }
function navWrap(dir){
  const c=cur(); const n=c.items().length; if(!n) return;
  c.sel=((c.sel+dir)%n+n)%n; renderAll();
  const el=panelEl.querySelectorAll(".mitem")[c.sel];
  if(el) el.scrollIntoView({block:"nearest"});
}
function choose(){
  const c=cur(); const items=c.items(); const it=items[c.sel];
  if(!it) return;
  if(it.dis){ toast(it.disMsg||"Not available right now!"); return; }
  if(it.run) it.run(); else if(it.sub) pushMenu(it.sub);
  renderAll(); // keep hearts, money & menus fresh after every action
}

function renderPanel(){
  const c=cur();

  let h='<div class="mHead"><h3>'+c.title+'</h3>'+(c.sub?'<small>'+c.sub+'</small>':"")+'</div>';
  h+=items.map((it,i)=>{
    const cls="mitem"+(i===c.sel?" sel":"")+(it.dis?" dis":"");
    return '<div class="'+cls+'"><div class="t">'+it.t+'</div>'+(it.d?'<div class="d">'+it.d+'</div>':"")+'</div>';

        state.inv.ring--; w.married=true; state.money-=800;
        toast("⛩️💍 WEDDING!! "+w.n+" cries tears of joy. The whole town throws rice! Wives: "+WIVES().length+" • Paid "+money(800)+" ceremony fee.");
        confetti(); save(); checkWin(); popMenu(); popMenu();
      }},
    {t:"↩ Back", d:"Wave goodbye… for now.", run:()=>popMenu()},
  ];
  return items;
}

// ---- Locations ----
function locMenu(id){
  const L=LOCS[id];
  const here=WOMEN.filter(w=>w.loc===id);
  const items=here.map(w=>{
    const ws=WOM(w.id);
    return {t:"🌸 "+w.n+" — "+w.j+"　"+AFF_LABEL(ws)+"  ♥ "+ws.aff, d:ws.married?"Your lovely wife. 🏡":"Talk, gift, date… romance her!", run:()=>pushMenu("💗 "+w.n+" — "+w.j,"(Affection ♥ "+ws.aff+"/100)",()=>womanMenu(ws),{view:()=>womanView(ws)})};
  });
  if(id==="home"){
    items.push({t:"😴 Go to Sleep — End the Day", d:"Advance time, collect income, welcome newborns!", run:endDay});
    items.push({t:"👶 Try for a Baby", d:"With any of your wives. ($600 per attempt; babies arrive tomorrow.)", run:()=>pushMenu("👶 Family Planning","(The apartment is extremely cozy)",()=>babyMenu())});
    items.push({t:"🧒 Offspring Album", d:"Admire your family! They earn money every day!", run:()=>pushMenu("👨‍👩‍👧‍👦 The Family Portrait","(Each child a random combination of mother + you)",()=>kidsMenu(),{view:familyView})});
    items.push({t:"💼 Benefits Office — Perks", d:"Spend money to make money (and babies) faster!", run:()=>pushMenu("💼 Perk Shop","(Perks for money + offspring!)",()=>perkMenu())});
  }
  if(id==="gift"){ items.push(...shopMenu()); }
  if(id==="salon"){ items.push(...salonMenu()); }
  if(id==="shrine"){
    items.push({t:"🙏 Pray for Couple's Luck", d:"Once per day the shrine may bless your wallet.", dis:state.prayedDay===state.day, disMsg:"You already prayed today. The gods appreciate enthusiasm, not spam.",
      run:()=>{ state.prayedDay=state.day; const b=pick([50,100,150,300]); state.money+=b; toast("⛩️✨ A soft golden light! You find "+money(b)+" in the donation box… label says 'For you, future spouse'"); save(); }});
    items.push({t:"🎎 Wedding Goddess Flavor Text", d:"\"Every union here is destiny.\" Guaranteed.",
      run:()=>toast("The shrine goddess smiles: \"Every union here is destiny. Bring a ring 💍 and a heart at 100 ♥.\"")});
  }
  items.push({t:"🗺️ Open Town Map", d:"Travel anywhere in LOVE TOWN ∞", run:()=>pushMenu("🗺️ Town Map","(Choose your destination!)",()=>mapMenu())});
  items.push({t:"🔑 Title Screen / Restart", d:"Character creation from the beginning (confirm!)", run:()=>{ if(confirm("Restart from the beginning? Current progress will be overwritten!")){ localStorage.removeItem(KEY); location.reload(); } }});
  return items;
}
function mapMenu(){
  return Object.keys(LOCS).map(k=>{
    const L=LOCS[k];
    const who=WOMEN.filter(w=>w.loc===k).map(w=>w.n).join(", ");
    return {t:L.e+" "+L.n+(state.loc===k?"　(you are here)":""), d:L.d+(who?"　•　🌸 "+who:""),
      run:()=>{ if(state.loc===k) toast("You're already here!"); else { state.loc=k; popMenu(); pushMenu(L.n,L.e+" "+L.d,()=>locMenu(k)); } }};
  });
}

// ---------- End day ----------
function endDay(){
  const inc=dailyIncome();
  state.money+=inc; state.day++;
  const births=[];
  WOMEN.forEach(wd=>{
    const w=WOM(wd.id);
    if(w.pregnant){
      w.pregnant=false;
      let twins=Math.random()<(state.perks.quiver?0.4:0.15)?2:1;
      for(let i=0;i<twins;i++) births.push(makeKid(wd.id));
    }
  });
  let msg="📅 Day "+state.day+" dawns! Income collected: <b>"+money(inc)+"</b>.";
  if(births.length) msg+="<br>👶✨ BIRTH! "+births.map(k=>k.name+" ("+(k.sex==="m"?"son":"daughter")+" of "+cap1(k.mom)+")").join(" & ")+" — future money-makers!";
  toast(msg); save(); checkWin();
}
function makeKid(momId){
  const wd=WOMEN.find(w=>w.id===momId); const P=state.player;
  const sex=Math.random()<0.5?"m":"f";
  const hairP=[P.hair,wd.hair][rnd(2)];
  const hc=Math.random()<0.45?wd.hc:(Math.random()<0.82?P.hairColor:shade(P.hairColor==="#2b2320"?wd.hc:P.hairColor,1.15));
  const skin=Math.random()<0.5?P.skin:wd.skin;
  const kid={ name:pick(sex==="m"?BOYHOST:GIRLHOST)+(rnd(2)&&state.kids.length?" "+["II","Jr.","the Bold","the Bright"][rnd(4)]:""),
    sex, body:rnd(3), hair:HAIRSTYLES.includes(hairP)?hairP:rnd(HAIRSTYLES.length), hairColor:hc, skin, eyes:pick(EYECOLORS),
    mom:wd.n };
  // girls take after moms a bit more often
  if(sex==="f"&&Math.random()<0.5&&kid.hairColor!==wd.hc){ kid.hairColor=wd.hc; kid.hair=wd.hair; }
  state.kids.push(kid);
  return kid;
}
function checkWin(){
  if(WIVES().length>=5&&KIDCOUNT()>=10&&state.phase!=="won"){
    state.phase="won";
    showModal('<div class="heartline">♥♥♥ ♥♥♥ ♥♥♥</div><h1>🏆 PERFECT BIG HAPPY FAMILY!!</h1><p>You married <b>'+WIVES().length+'</b> wives and raised <b>'+KIDCOUNT()+'</b> beautiful offspring — every one a random combo of mother & you!</p><p>Your empire of love generates <b>'+money(dailyIncome())+'</b> per day. The mayor of LOVE TOWN declares this a national holiday. 🌸</p><div class="heartline">♥♥♥ ♥♥♥ ♥♥♥</div><button onclick="document.getElementById(\'modal\').style.display=\'none\'">Keep Playing 💞</button>');
  }
}
function confetti(){
  for(let i=0;i<24;i++){
    const s=document.createElement("span"); s.textContent=pick(["🌸","♥","✨","🎉","💍"]);
    s.style.cssText="position:fixed;z-index:70;pointer-events:none;font-size:"+(14+rnd(16))+"px;left:"+(rnd(100))+"%;top:-30px;transition:transform 1.8s ease-in,opacity 2s;";
    document.body.appendChild(s);
    requestAnimationFrame(()=>{ s.style.transform="translateY("+(window.innerHeight+60)+"px) rotate("+rnd(720)+"deg)"; s.style.opacity="0.1"; });
    setTimeout(()=>s.remove(),2200);
  }
}

// ============================================================
//  🎬 BOOT — title & character creation
// ============================================================
function bootFromSave(){
  if(!load()) return false;
  if(!state.player){ return false; }
  if(state.phase==="won"){ state.phase="game"; }
  initWomanState();
  menus=[]; pushMenu("Welcome back!","(Day "+state.day+" — money "+money(state.money)+")",()=>locMenu(state.loc));
  toast("💾 Save file loaded! Welcome back to LOVE TOWN ∞"); return true;
}
function startTitle(){
  const defaultP={name:"", sex:"m", body:1, hair:0, hairColor:HAIRCOLORS[rnd(HAIRCOLORS.length)], skin:rnd(SKINS.length), eyes:EYECOLORS[0], outfit:0};
  state.player=defaultP;
  pushMenu("✨ CREATE YOUR CHARACTER ✨","Get everything about your early-aughts protagonist just right, then hit Begin!",function(){
    return customizeItems(false).concat([
    {t:"💗 BEGIN YOUR NEW LIFE!! 🎉", d:"You've just graduated with "+money(10000)+" to your name. LOVE TOWN ∞ awaits: the only town in the world consisting entirely of women!",
      run:()=>{
        if(!state.player.name){ state.player.name=prompt("One last thing — your name:","Kazuma")||"Kazuma"; }
        state.phase="game"; state.money=10000; state.loc="home"; initWomanState();
        menus=[]; pushMenu("🌸 Day 1 — Your Graduation","(money "+money(state.money)+" — spend wisely!)",()=>locMenu("home"));
        toast("🎓✨ You've moved into LOVE TOWN ∞! Explore the map 🗺️, meet the women 🌸, buy gifts at the Gift Shoppe 🎁 and take dates 💑. The side buttons scroll every menu ▲▼");
        save();
      }
    },
  ]);},{view:bigAvatarView, sub:"Only MALE or FEMALE — just how you like your dating sims. ✔ button cycles the selected option; ◀ goes back."});
  renderAll();
}

// init
initWomanState();
if(!bootFromSave()) startTitle();

// Buttons
document.getElementById("bUp").onclick=()=>navWrap(-1);
document.getElementById("bDn").onclick=()=>navWrap(1);
document.getElementById("bSel").onclick=()=>choose();
document.getElementById("bBk").onclick=()=>popMenu();
document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowUp"){e.preventDefault();navWrap(-1);}
  else if(e.key==="ArrowDown"){e.preventDefault();navWrap(1);}
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();choose();}
  else if(e.key==="Escape"||e.key==="Backspace"){e.preventDefault();popMenu();}
});
// initial paint
renderAll();
</script>
</body>
</html>
